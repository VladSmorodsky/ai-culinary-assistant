name: meal-assistant
networks:
    default:
        driver: bridge
services:
  assistant:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - INSTALL_DEV=true
    container_name: meal-assistant
    ports:
      - "8000:8000"
    volumes:
      - ./:/app
      - ./data:/app/data
    env_file:
      - .env
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-fsS", "http://localhost:8000/health" ]
      interval: 15s
      timeout: 5s
      retries: 10
